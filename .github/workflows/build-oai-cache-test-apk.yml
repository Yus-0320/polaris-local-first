name: Build OAI cache test APK

on:
  push:
    branches:
      - fix/oai-prompt-cache-order

permissions:
  contents: read

jobs:
  test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/oai-prompt-cache-order

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore deterministic cache-test signing key
        uses: actions/cache@v4
        with:
          path: android/app/cachetest-debug.keystore
          key: polaris-cachetest-signing-v2

      - name: Create signing key if this is the first v2 build
        shell: bash
        run: |
          if [ ! -f android/app/cachetest-debug.keystore ]; then
            keytool -genkeypair \
              -keystore android/app/cachetest-debug.keystore \
              -storepass android \
              -alias cachetest \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Polaris Cache Test,O=Polaris,C=US"
          fi
          echo "Signing certificate before build:"
          keytool -list -v \
            -keystore android/app/cachetest-debug.keystore \
            -storepass android \
            -alias cachetest | grep -E 'SHA256:|Alias name:'

      - name: Pin debug build to deterministic signing key
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle')
          text = path.read_text()
          signing = '''    signingConfigs {
        cachetestDebug {
            storeFile file('cachetest-debug.keystore')
            storePassword 'android'
            keyAlias 'cachetest'
            keyPassword 'android'
        }
    }
'''
          if 'cachetestDebug {' not in text:
              marker = '    buildTypes {'
              if marker not in text:
                  raise SystemExit('buildTypes marker not found')
              text = text.replace(marker, signing + marker, 1)
          old = '''        debug {
            applicationIdSuffix ".cachetest"
            versionNameSuffix "-cachetest"
        }'''
          new = '''        debug {
            applicationIdSuffix ".cachetest"
            versionNameSuffix "-cachetest"
            signingConfig signingConfigs.cachetestDebug
        }'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('debug buildType marker not found')
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run cache compatibility regression tests
        run: npx vitest run src/engines/provider-runtime/providerCapability.test.ts src/engines/provider-runtime/providerRuntimeOpenAiCompatibleAdapter.test.ts src/engines/provider-runtime/providerRuntimeAnthropicAdapter.test.ts

      - name: Build Android debug APK
        run: npm run android:build-debug

      - name: Verify APK signing certificate
        shell: bash
        run: |
          APKSIGNER="${ANDROID_HOME}/build-tools/$(ls -1 ${ANDROID_HOME}/build-tools | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'Signer #1 certificate SHA-256 digest|Signer #1 certificate DN'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: polaris-cache-test-v4-stable-signing
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
