name: Build OAI cache test APK

on:
  push:
    branches:
      - fix/oai-prompt-cache-order

permissions:
  contents: write

jobs:
  patch-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/oai-prompt-cache-order

      - name: Apply narrow custom-OAI cache-order patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/engines/provider-runtime/providerCapability.ts')
          text = source.read_text()
          old = "      deferVolatileSystemMessages: protocolShape.cacheMode === 'automatic-or-unknown' || openAiCompatibleCacheControl,"
          new = """      deferVolatileSystemMessages:\n        openAiCompatibleCacheControl\n        || (\n          protocolShape.cacheMode === 'automatic-or-unknown'\n          && !(protocol === 'openai-completions' && profile.routeKind === 'custom-direct')\n        ),"""
          if old not in text:
              raise SystemExit('providerCapability.ts patch target not found')
          source.write_text(text.replace(old, new, 1))

          test = Path('src/engines/provider-runtime/providerCapability.test.ts')
          test_text = test.read_text()
          marker = "  it('uses portable explicit cache controls without top-level auto caching for OpenRouter Claude', () => {"
          addition = """  it('preserves conventional system-prefix ordering for custom OpenAI-compatible automatic cache routes', () => {\n    const capability = resolveProviderCapability(createProviderRuntimeTestProvider({\n      baseUrl: 'https://provider.example.com/v1',\n      path: '/chat/completions',\n      model: 'claude-sonnet-4-5',\n      capabilities: {\n        images: true,\n        streaming: true,\n        thinking: false\n      }\n    }));\n\n    expect(capability.route.kind).toBe('custom-direct');\n    expect(capability.cache.mode).toBe('automatic-or-unknown');\n    expect(capability.context.deferVolatileSystemMessages).toBe(false);\n    expect(capability.context.omitVolatileSystemMessages).toBe(false);\n  });\n\n"""
          if addition not in test_text:
              if marker not in test_text:
                  raise SystemExit('providerCapability.test.ts insertion target not found')
              test.write_text(test_text.replace(marker, addition + marker, 1))
          PY

      - name: Commit isolated patch to test branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engines/provider-runtime/providerCapability.ts src/engines/provider-runtime/providerCapability.test.ts
          git commit -m "fix: preserve prefix order for custom OAI cache [skip ci]"
          git push origin HEAD:fix/oai-prompt-cache-order

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run provider capability regression tests
        run: npx vitest run src/engines/provider-runtime/providerCapability.test.ts

      - name: Build Android debug APK
        run: npm run android:build-debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: polaris-oai-cache-test-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
