name: Build OAI cache test APK

on:
  push:
    branches:
      - fix/oai-prompt-cache-order

permissions:
  contents: write

jobs:
  patch-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/oai-prompt-cache-order

      - name: Refine custom-OAI cache-order patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/engines/provider-runtime/providerCapability.ts')
          text = source.read_text()
          old = """      deferVolatileSystemMessages:
        openAiCompatibleCacheControl
        || (
          protocolShape.cacheMode === 'automatic-or-unknown'
          && !(protocol === 'openai-completions' && profile.routeKind === 'custom-direct')
        ),"""
          new = """      deferVolatileSystemMessages:
        openAiCompatibleCacheControl
        || (
          protocolShape.cacheMode === 'automatic-or-unknown'
          && !(
            protocol === 'openai-completions'
            && profile.routeKind === 'custom-direct'
            && !isDeepSeekHost(host)
          )
        ),"""
          if old in text:
              source.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('providerCapability.ts refinement target not found')
          PY

      - name: Commit refined patch to test branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Patch already refined"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engines/provider-runtime/providerCapability.ts
          git commit -m "fix: preserve DeepSeek volatile context behavior [skip ci]"
          git push origin HEAD:fix/oai-prompt-cache-order

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run provider capability regression tests
        run: npx vitest run src/engines/provider-runtime/providerCapability.test.ts

      - name: Build Android debug APK
        run: npm run android:build-debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: polaris-oai-cache-test-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
