name: Build OAI cache test APK

on:
  push:
    branches:
      - fix/oai-prompt-cache-order

permissions:
  contents: write

jobs:
  patch-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/oai-prompt-cache-order

      - name: Patch APIKEY.FUN cache-key and Anthropic message breakpoints
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # OpenAI-compatible: send a stable cache key for APIKEY.FUN.
          source = Path('src/engines/provider-runtime/providerRuntimeOpenAiCompatibleAdapter.ts')
          text = source.read_text()
          old = "  const openRouterSessionId = resolveOpenRouterSessionId(api.baseUrl, sessionId);\n  if (openRouterSessionId) {\n    body.session_id = openRouterSessionId;\n  }"
          new = "  if (parseProviderHost(api.baseUrl) === 'api.apikey.fun' && sessionId?.trim()) {\n    body.prompt_cache_key = sessionId.trim();\n  }\n  const openRouterSessionId = resolveOpenRouterSessionId(api.baseUrl, sessionId);\n  if (openRouterSessionId) {\n    body.session_id = openRouterSessionId;\n  }"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('OAI prompt_cache_key patch target not found')
          source.write_text(text)

          test = Path('src/engines/provider-runtime/providerRuntimeOpenAiCompatibleAdapter.test.ts')
          text = test.read_text()
          marker = "  {\n    id: 'siliconflow-tool-calls-disable-streaming',"
          addition = "  {\n    id: 'apikeyfun-claude-stable-prompt-cache-key',\n    input: {\n      api: createProviderRuntimeTestProvider({\n        baseUrl: 'https://api.apikey.fun/v1',\n        path: '/chat/completions',\n        model: 'claude-sonnet-4-6',\n        capabilities: { images: true, streaming: true, thinking: false }\n      }),\n      context: createProviderRuntimeTestContext({ withTools: false }),\n      sessionId: 'conversation-apikeyfun-1',\n      advanced: createProviderRuntimeAdvanced()\n    },\n    verify(request) {\n      expect(request.body.prompt_cache_key).toBe('conversation-apikeyfun-1');\n      expect(request.body.session_id).toBeUndefined();\n    }\n  },\n"
          if addition not in text:
              if marker not in text:
                  raise SystemExit('OAI adapter test insertion target not found')
              text = text.replace(marker, addition + marker, 1)
              test.write_text(text)

          # Anthropic: use explicit breakpoints on the latest two textual turns for APIKEY.FUN.
          source = Path('src/engines/provider-runtime/providerRuntimeAnthropicAdapter.ts')
          text = source.read_text()
          import_marker = "import { resolveOpenRouterSessionId } from './providerRuntimeOpenRouterSession';"
          import_line = "import { parseProviderHost } from './internal/providerMatching';"
          if import_line not in text:
              if import_marker not in text:
                  raise SystemExit('Anthropic import insertion target not found')
              text = text.replace(import_marker, import_marker + "\n" + import_line, 1)

          helper_lines = [
              "function applyAnthropicConversationCacheBreakpoints(",
              "  messages: Array<{ role: 'user' | 'assistant'; content: string | AnthropicContentBlock[] }>",
              ") {",
              "  const targetIndexes = new Set<number>();",
              "  for (let index = messages.length - 1; index >= 0 && targetIndexes.size < 2; index -= 1) {",
              "    const message = messages[index];",
              "    if (!message) continue;",
              "    if (normalizeAnthropicBlocks(message.content).some((block) => block.type === 'text' && block.text.trim())) {",
              "      targetIndexes.add(index);",
              "    }",
              "  }",
              "",
              "  return messages.map((message, index) => {",
              "    if (!targetIndexes.has(index)) return message;",
              "    const blocks = normalizeAnthropicBlocks(message.content).map((block) => ({ ...block }));",
              "    for (let blockIndex = blocks.length - 1; blockIndex >= 0; blockIndex -= 1) {",
              "      const block = blocks[blockIndex];",
              "      if (block?.type !== 'text' || !block.text.trim()) continue;",
              "      blocks[blockIndex] = { ...block, cache_control: { type: 'ephemeral' } };",
              "      break;",
              "    }",
              "    return { ...message, content: blocks };",
              "  });",
              "}",
              ""
          ]
          helper = "\n".join(helper_lines)
          helper_marker = "function resolveAnthropicSystemCacheControlIndexes("
          if 'function applyAnthropicConversationCacheBreakpoints(' not in text:
              if helper_marker not in text:
                  raise SystemExit('Anthropic helper insertion target not found')
              text = text.replace(helper_marker, helper + "\n" + helper_marker, 1)

          old = "  const system = buildAnthropicSystemContent(context);\n  const anthropicMessages = buildAnthropicMessages(context);\n\n  if (anthropicMessages.length === 0) {"
          new = "  const system = buildAnthropicSystemContent(context);\n  const anthropicMessages = buildAnthropicMessages(context);\n  const host = parseProviderHost(api.baseUrl);\n  const requestMessages = host === 'api.apikey.fun'\n    ? applyAnthropicConversationCacheBreakpoints(anthropicMessages)\n    : anthropicMessages;\n\n  if (requestMessages.length === 0) {"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Anthropic request-message patch target not found')

          old = "    max_tokens: maxTokens ?? DEFAULT_ANTHROPIC_MAX_TOKENS,\n    messages: anthropicMessages\n  };\n  if (providerCapability.cache.sendsTopLevelCacheControl) {\n    body.cache_control = { type: 'ephemeral' };\n  }"
          new = "    max_tokens: maxTokens ?? DEFAULT_ANTHROPIC_MAX_TOKENS,\n    messages: requestMessages\n  };\n  if (providerCapability.cache.sendsTopLevelCacheControl && host !== 'api.apikey.fun') {\n    body.cache_control = { type: 'ephemeral' };\n  }"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Anthropic body patch target not found')
          source.write_text(text)

          test = Path('src/engines/provider-runtime/providerRuntimeAnthropicAdapter.test.ts')
          text = test.read_text()
          marker = "  {\n    id: 'anthropic-packy-bearer-auth',"
          addition = "  {\n    id: 'apikeyfun-anthropic-conversation-cache-breakpoints',\n    input: {\n      api: createProviderRuntimeTestProvider({\n        protocol: 'anthropic-messages',\n        baseUrl: 'https://api.apikey.fun/v1',\n        path: '/messages',\n        model: 'claude-sonnet-4-6',\n        capabilities: { images: true, streaming: true, thinking: false }\n      }),\n      context: createProviderRuntimeTestContext({ withTools: false }),\n      advanced: createProviderRuntimeAdvanced({ maxTokens: '128' })\n    },\n    verify(request) {\n      expect(request.body.cache_control).toBeUndefined();\n      const messages = readArray(request.body.messages);\n      const cachedTail = messages.slice(-2).filter((message) =>\n        readArray(readObject(message).content).some((block) => readObject(block).cache_control !== undefined)\n      );\n      expect(cachedTail.length).toBeGreaterThan(0);\n    }\n  },\n"
          if addition not in text:
              if marker not in text:
                  raise SystemExit('Anthropic adapter test insertion target not found')
              test.write_text(text.replace(marker, addition + marker, 1))
          PY

      - name: Commit cache compatibility patch to test branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engines/provider-runtime/providerRuntimeOpenAiCompatibleAdapter.ts
          git add src/engines/provider-runtime/providerRuntimeOpenAiCompatibleAdapter.test.ts
          git add src/engines/provider-runtime/providerRuntimeAnthropicAdapter.ts
          git add src/engines/provider-runtime/providerRuntimeAnthropicAdapter.test.ts
          git commit -m "test: align APIKEY.FUN cache key and conversation breakpoints [skip ci]"
          git push origin HEAD:fix/oai-prompt-cache-order

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: polaris-cachetest-debug-keystore-v1

      - name: Install dependencies
        run: npm ci

      - name: Run cache compatibility regression tests
        run: npx vitest run src/engines/provider-runtime/providerCapability.test.ts src/engines/provider-runtime/providerRuntimeOpenAiCompatibleAdapter.test.ts src/engines/provider-runtime/providerRuntimeAnthropicAdapter.test.ts

      - name: Build Android debug APK
        run: npm run android:build-debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: polaris-oai-cache-test-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
