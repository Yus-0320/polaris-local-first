name: Build OAI cache test APK

on:
  push:
    branches:
      - fix/oai-prompt-cache-order

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/oai-prompt-cache-order

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore deterministic cache-test signing key
        uses: actions/cache@v4
        with:
          path: android/app/cachetest-debug.keystore
          key: polaris-cachetest-signing-v2

      - name: Ensure deterministic signing key
        shell: bash
        run: |
          if [ ! -f android/app/cachetest-debug.keystore ]; then
            keytool -genkeypair -keystore android/app/cachetest-debug.keystore -storepass android -alias cachetest -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Polaris Cache Test,O=Polaris,C=US"
          fi
          keytool -list -v -keystore android/app/cachetest-debug.keystore -storepass android -alias cachetest | grep -E 'SHA256:|Alias name:'

      - name: Install dependencies
        run: npm ci

      - name: Run cache compatibility regression tests
        run: npx vitest run src/engines/provider-runtime/providerCapability.test.ts src/engines/provider-runtime/providerRuntimeOpenAiCompatibleAdapter.test.ts src/engines/provider-runtime/providerRuntimeAnthropicAdapter.test.ts

      - name: Build Android debug APK
        run: npm run android:build-debug

      - name: Verify APK signing certificate
        shell: bash
        run: |
          APKSIGNER="${ANDROID_HOME}/build-tools/$(ls -1 ${ANDROID_HOME}/build-tools | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: polaris-cache-test-v4-stable-signing
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
