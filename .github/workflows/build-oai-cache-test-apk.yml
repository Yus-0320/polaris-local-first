name: Build OAI cache test APK

on:
  push:
    branches:
      - fix/oai-prompt-cache-order

permissions:
  contents: write

jobs:
  patch-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/oai-prompt-cache-order

      - name: Patch APIKEY.FUN Claude cache controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/engines/provider-runtime/providerCapability.ts')
          text = source.read_text()

          old_order = "\n".join([
              "      deferVolatileSystemMessages:",
              "        openAiCompatibleCacheControl",
              "        || (",
              "          protocolShape.cacheMode === 'automatic-or-unknown'",
              "          && !(protocol === 'openai-completions' && profile.routeKind === 'custom-direct')",
              "        ),",
          ])
          new_order = "\n".join([
              "      deferVolatileSystemMessages:",
              "        openAiCompatibleCacheControl",
              "        || (",
              "          protocolShape.cacheMode === 'automatic-or-unknown'",
              "          && !(",
              "            protocol === 'openai-completions'",
              "            && profile.routeKind === 'custom-direct'",
              "            && !isDeepSeekHost(host)",
              "          )",
              "        ),",
          ])
          if old_order in text:
              text = text.replace(old_order, new_order, 1)

          old_cache = "  const openAiCompatibleCacheControl = isOpenRouterAnthropicClaudeCacheRoute(runtimeProvider, protocol, host);"
          new_cache = "\n".join([
              "  const openAiCompatibleCacheControl =",
              "    isOpenRouterAnthropicClaudeCacheRoute(runtimeProvider, protocol, host)",
              "    || (",
              "      protocol === 'openai-completions'",
              "      && host === 'api.apikey.fun'",
              "      && isClaudeModel(runtimeProvider.model)",
              "    );",
          ])
          if old_cache in text:
              text = text.replace(old_cache, new_cache, 1)
          elif new_cache not in text:
              raise SystemExit('APIKEY.FUN cache-control patch target not found')
          source.write_text(text)

          test = Path('src/engines/provider-runtime/providerCapability.test.ts')
          test_text = test.read_text()
          marker = "  it('uses portable explicit cache controls without top-level auto caching for OpenRouter Claude', () => {"
          addition = """  it('uses explicit cache controls for APIKEY.FUN Claude chat completions', () => {\n    const capability = resolveProviderCapability(createProviderRuntimeTestProvider({\n      baseUrl: 'https://api.apikey.fun/v1',\n      path: '/chat/completions',\n      model: 'claude-sonnet-4-6',\n      capabilities: {\n        images: true,\n        streaming: true,\n        thinking: false\n      }\n    }));\n\n    expect(capability.cache).toEqual({\n      mode: 'explicit-cache-control',\n      promptCaching: true,\n      openAiCompatibleCacheControl: true,\n      sendsTopLevelCacheControl: false,\n      automaticMessageHistoryCache: false\n    });\n    expect(capability.context.deferVolatileSystemMessages).toBe(true);\n  });\n\n"""
          if addition not in test_text:
              if marker not in test_text:
                  raise SystemExit('providerCapability.test.ts insertion target not found')
              test.write_text(test_text.replace(marker, addition + marker, 1))
          PY

      - name: Commit cache-control patch to test branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engines/provider-runtime/providerCapability.ts src/engines/provider-runtime/providerCapability.test.ts
          git commit -m "test: enable APIKEY.FUN Claude cache controls [skip ci]"
          git push origin HEAD:fix/oai-prompt-cache-order

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: polaris-cachetest-debug-keystore-v1

      - name: Install dependencies
        run: npm ci

      - name: Run provider capability regression tests
        run: npx vitest run src/engines/provider-runtime/providerCapability.test.ts

      - name: Build Android debug APK
        run: npm run android:build-debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: polaris-oai-cache-test-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
